# Spring Boot application configuration
spring.application.name=road-accident-backend

# H2 in-memory database (data is lost on restart — fine for academic demo)
spring.datasource.url=jdbc:h2:mem:roadaccidentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console (open http://localhost:8080/h2-console to browse the DB)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server port
server.port=8080

# Absolute path to the reports directory (where train.py saves charts and metrics.json)
# Update this path if you move the project
reports.absolute.path=C:/Users/RISHITA PRIYA/OneDrive/Desktop/Projects/Road_Accidents_predicton/road-accident-app/reports

# Absolute path to options.json (generated by train.py)
options.file.path=C:/Users/RISHITA PRIYA/OneDrive/Desktop/Projects/Road_Accidents_predicton/road-accident-app/ml-service/options.json

# Flask ML service URL
ml.service.url=http://localhost:5000
